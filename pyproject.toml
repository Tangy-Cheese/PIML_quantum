[project]
name = "Rescattered-ATI_PINNs"
version = "1.0.0"
description = "Windowed physics-informed neural networks for the rescattered-ATI saddle-point equations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pinn_common", "paths"]
packages = ["classical_solvers"]
