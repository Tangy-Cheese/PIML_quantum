[project]
name = "ati-atto"
version = "1.0.0"
description = "Windowed physics-informed neural networks for the rescattered-ATI saddle-point equations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# The physics modules are flat modules under src/, imported as `continuation`,
# `bichromatic`, `pinn_common`, `paths`. Scripts also insert src/ on sys.path
# directly, so an install is convenient but not required.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["continuation", "bichromatic", "pinn_common", "paths"]
